name: Logistik final pilot QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logistik-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: logistik_ci
          POSTGRES_PASSWORD: local_ci_only_password
          POSTGRES_DB: logistik_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logistik_ci -d logistik_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install tested dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: API, permissions, CSV, restore and design regression
        run: python -m pytest -q
      - name: Five independent sessions through HTTP
        run: python verify_multiuser_http.py
      - name: PostgreSQL concurrency and recovery
        env:
          LOGISTIK_QA_DATABASE_URL: postgresql://logistik_ci:local_ci_only_password@127.0.0.1:5432/logistik_ci
        run: python scripts/verify_postgres.py
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - name: Install browser test dependencies
        run: python3 -m pip install --break-system-packages -r requirements-browser.txt -c constraints.txt
      - name: Real registration and role workflows in desktop and mobile browsers
        run: |
          mkdir -p artifacts/roles-2.8 data
          chown -R pwuser:pwuser artifacts/roles-2.8 data
          runuser -u pwuser -- python3 scripts/verify_roles_browser.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: role-workflows-2.8
          path: artifacts/roles-2.8/
          retention-days: 14
          if-no-files-found: ignore
