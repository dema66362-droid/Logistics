let audioContext=null;
async function enableSound(){try{if(!audioContext)audioContext=new (window.AudioContext||window.webkitAudioContext)();await audioContext.resume();state.soundOn=!state.soundOn;toast(state.soundOn?'Звуковые сигналы включены для открытого сайта':'Звук выключен');render()}catch{toast('Браузер не разрешил воспроизведение звука')}}
function beep(){if(!state.soundOn||!audioContext)return;try{const t=audioContext.currentTime;for(const offset of [0,.22,.47]){const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();oscillator.frequency.value=740;oscillator.type='sine';gain.gain.setValueAtTime(.0001,t+offset);gain.gain.exponentialRampToValueAtTime(.13,t+offset+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+offset+.17);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(t+offset);oscillator.stop(t+offset+.18)}}catch{}}

async function api(path,method='GET',body){
 const generation=authGeneration;
 const opts={method,credentials:'same-origin',headers:{'Accept':'application/json'}};
 if(method!=='GET')opts.headers['X-CSRF-Token']=state.csrf;
 if(body!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}
 const r=await fetch(path,opts);let data={};try{data=await r.json()}catch{}
 if(!r.ok){const msg=typeof data.detail==='string'?data.detail:Array.isArray(data.detail)?'Проверьте обязательные поля и допустимые значения':'Ошибка сервера ('+r.status+')';if(r.status===401&&path!=='/api/login'&&generation===authGeneration)showLogin();const err=Error(msg);err.status=r.status;throw err}
 return data;
}
async function loadState({fromEvent=false}={}){
 const generation=authGeneration,requestId=++lastStateRequest,openedModal=state.modal;
 const data=await api('/api/state');
 if(generation!==authGeneration||requestId!==lastStateRequest)return;
 state.orders=data.orders;state.offers=data.offers;state.drivers=data.drivers;state.vehicles=data.vehicles;state.user=data.user;state.csrf=data.csrf;
 state.businessDay=data.day;state.notifications=data.notifications||[];state.unreadTotal=data.unreadNotifications;
 const highest=state.notifications.reduce((x,n)=>Math.max(x,n.id),0);
 const fresh=state.notifications.filter(n=>!n.read&&n.id>state.seenNoteId);
 if(!state.firstNotes&&fresh.length){beep();toast(fresh[0].title+': '+fresh[0].message)}
 state.firstNotes=false;state.seenNoteId=Math.max(state.seenNoteId,highest);
 if(!state.focus||!getOrder(state.focus))state.focus=state.orders.find(o=>o.date===state.day&&o.status==='choice')?.id||state.orders.find(o=>o.date===state.day)?.id||state.orders[0]?.id||'';
 if(!state.initialized){state.day=data.day;state.initialized=true}
 if(!fromEvent&&state.modal===openedModal)state.modal='';document.body.classList.remove('login-view');if(!(fromEvent&&state.modal))render();if(!eventFeed)connectEvents();
}
