<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Администратор · Логистик</title><style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f4f6fa;color:#19243b;margin:0;padding:5vh 16px}main{max-width:570px;margin:auto;background:white;padding:clamp(20px,5vw,40px);border:1px solid #dde3ed;border-radius:20px}h1{font-size:26px}label{display:grid;gap:5px;margin:14px 0}input,button{font:inherit;border:1px solid #cbd3de;border-radius:8px;padding:10px}button{background:#eef3fb;color:#173867;cursor:pointer}button[type=submit]{background:#2456c8;color:white}#status{color:#8a2939}p{line-height:1.5}#actions{display:flex;gap:7px;flex-wrap:wrap}[hidden]{display:none!important}small{color:#576579}
</style></head><body><main><a href="/">Логистик</a><h1>Администратор сайта</h1><form id="login"><label>Логин<input name="login" required autocomplete="username"></label><label>Пароль<input type="password" name="password" required autocomplete="current-password"></label><button type="submit">Войти</button></form><section id="panel" hidden><form id="lookup"><label>ИНН компании<input name="inn" inputmode="numeric" pattern="([0-9]{10}|[0-9]{12})" maxlength="12" required></label><button type="submit">Найти компанию</button></form><div id="result"></div><div id="actions" hidden><button data-action="block">Заблокировать</button><button data-action="unblock">Разблокировать</button><button data-action="delete">Удалить участника</button></div><p><button id="logout">Выйти</button></p></section><p id="status" role="status"></p></main>
<script>
const by=id=>document.getElementById(id);let csrf='',current='';
async function api(path,body){const opt={credentials:'same-origin',headers:{'X-CSRF-Token':csrf}};if(body){opt.method='POST';opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}const r=await fetch('/api/site-admin/'+path,opt),data=await r.json();if(!r.ok)throw Error(data.detail||'Ошибка');return data}
function display(token){csrf=token;by('login').hidden=!!token;by('panel').hidden=!token}
const names={active:'действует',blocked:'заблокирован',deleted:'удалён',shipper:'заказчик',carrier:'перевозчик'};
async function find(){const r=await api('company?inn='+encodeURIComponent(by('lookup').elements.inn.value));current=r.inn;by('result').replaceChildren();for(const o of r.companies){const p=document.createElement('p');p.textContent=o.name+' · '+names[o.role]+' · '+names[o.state];by('result').append(p)}by('status').textContent=r.companies.length?'':'Компания не найдена';by('actions').hidden=!r.companies.length||r.restriction==='deleted';for(const b of by('actions').children)b.hidden=(b.dataset.action==='block'&&r.restriction==='blocked')||(b.dataset.action==='unblock'&&r.restriction!=='blocked')}
document.addEventListener('submit',async e=>{e.preventDefault();by('status').textContent='';try{if(e.target.id==='login'){const result=await api('login',Object.fromEntries(new FormData(e.target)));e.target.reset();display(result.csrf)}else await find()}catch(err){by('status').textContent=err.message}});
by('lookup').elements.inn.addEventListener('input',()=>{current='';by('actions').hidden=true;by('result').replaceChildren()});
document.addEventListener('click',async e=>{const a=e.target.dataset.action;try{if(a&&current){const label=e.target.textContent;if(!confirm(label+' по ИНН '+current+'?'+(a==='delete'?' Доступ всех сотрудников закроется. История рейсов партнёров сохранится.':'')))return;await api('company',{inn:current,action:a});await find()}if(e.target.id==='logout'){await api('logout',{});location.reload()}}catch(err){by('status').textContent=err.message}});
api('session').then(r=>display(r.csrf)).catch(()=>{});
</script></body></html>
